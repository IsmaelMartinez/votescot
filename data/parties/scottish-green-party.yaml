id: scottish-green-party
name: Scottish Green Party
positions:
  independence: 2
  nhs: 2
  housing: 2
  climate: 2
  tax: 2
  economy: 2
  education: 2
  equality: 2
stances:
  independence: Support independence and full powers of a sovereign nation, while pressing ahead with change using devolved powers now.
  nhs: Introduce a £15 per hour minimum wage for social care, a network of free walk-in mental health support hubs, and invest in the NHS workforce.
  housing: Permanent rent controls, a higher tax rate on landlords' rental income, and stronger renters' rights to tackle the housing emergency.
  climate: Get Scotland back on track to deliver net zero by 2045 with a coordinated climate action delivery programme across transport, energy, farming and buildings.
  tax: Tax wealth rather than work. More progressive income tax, higher taxes on second and empty homes, and new taxes on private jets and mansions.
  economy: Jobs in a green economy — clean industries, care, childcare and community wealth. Move away from expensive and volatile oil and gas.
  education: Universal free childcare guarantee from 6 months until children start school, with significant investment in the childcare workforce.
  equality: Strong LGBT+ rights advocacy. Revisit NHS policy changes made as a result of the Cass Review and publish a gender-affirming care action plan to bring down waiting times.
quotes:
  independence: "To realise our country's full potential, we must have the full powers of a normal, sovereign nation. But we can't wait until independence to start making a difference."
  nhs: "Introduce a £15 per hour minimum wage for social care, and ensure this increases annually with inflation at minimum."
  housing: "An emergency rent freeze and eviction ban during the peak of the cost of living crisis, and a new system of permanent rent controls."
  climate: "Get Scotland back on track to deliver net zero by 2045, launching a coordinated climate action delivery programme to drive down emissions from transport, energy, farming and buildings."
  tax: "Taxed the rich to pay for public services through a more progressive income tax system, higher taxes on second and empty homes, and securing new taxes on private jets and mansions."
  economy: "Investing in our future means creating more jobs in clean, green industries like renewable energy, whilst weaning our economy off of expensive and volatile oil and gas."
  education: "A universal free childcare guarantee, where all children in Scotland have access to funded childcare hours from 6 months until they start school."
  equality: "Revisit all NHS policy changes made as a result of the Cass Review to ensure they are aligned with international evidence-based best practice."
