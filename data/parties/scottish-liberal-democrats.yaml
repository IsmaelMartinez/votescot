id: scottish-liberal-democrats
name: Scottish Liberal Democrats
positions:
  independence: 0
  nhs: 2
  housing: 1
  climate: 1
  tax: 1
  economy: 1
  education: 1
  equality: 2
stances:
  independence: Oppose independence. Back a written constitution for a federal United Kingdom and a new bespoke UK-EU customs union.
  nhs: A 10-year NHS and care workforce plan, new neighbourhood health teams giving every GP practice the equivalent of an extra clinical staff member, walk-in mental health services and a Fair Deal for Rural Healthcare.
  housing: Return housebuilding to 25,000 new homes annually, create key worker housing, and replace the SNP's housing strategy with a new holistic data-driven approach.
  climate: Support net zero by 2045 with a programme for net zero new towns featuring rail links, district heating and 20-minute neighbourhoods.
  tax: Where funds allow, lift tax thresholds in line with inflation and begin to close the tax differential with England in a balanced way that protects public services.
  economy: Reform business rates to stop sudden tax hikes on successful employers and help people upskill through new Job Transition Loans worth up to £5,000.
  education: Hire 2,000 more pupil support assistants, roll out speech and language therapy and make every school a smartphone-free environment.
  equality: Strong defence of LGBT+ and trans rights. Ban all forms of conversion therapies and practices, working in partnership with the UK Government.
quotes:
  independence: "Back a written constitution for a federal United Kingdom."
  nhs: "This will be the equivalent of giving every GP practice an additional member of clinical staff, including nurses, physiotherapists, pharmacists, dieticians, phlebotomists, mental health professionals and counsellors."
  housing: "We will tackle the chronic housing shortage by returning housebuilding to a level that gets 25,000 new homes built annually, and create new key worker housing so that finding a home isn't a barrier to taking up a job when somewhere is crying out for your skills."
  climate: "Developing a programme for a new generation of net zero new towns, prioritising from the outset features such as rail links, biodiversity, district heating, and the 20-minute neighbourhood."
  tax: "Where funds are available, our priorities will be to lift tax thresholds in line with inflation and begin to close the tax differential with England in a balanced way that protects public services."
  economy: "We will make it easier to do business and stop sudden tax hikes threatening successful employers by reforming business rates."
  education: "Enshrine the right of children to learn, and teachers to teach, by making every school a smartphone-free environment."
  equality: "Banning all forms of conversion therapies and practices, working in partnership with the UK Government to achieve this."
