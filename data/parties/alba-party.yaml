stances:
  independence: Immediate and urgent push for independence. Argue the SNP has been too slow. Want to use a majority of Scottish seats as an independence mandate.
  nhs: Maintain NHS Scotland in public hands. Frame healthcare as a key argument for independence — Scotland controlling its own health policy.
  housing: Build more affordable and social housing. Support home ownership. Broadly supportive of current housing direction without the SNP's specific rent control approach.
  climate: Balanced transition approach. Support renewables but cautious about pace and economic cost. Retain North Sea production during transition.
  tax: Maintain the current Scottish income tax approach broadly. Prioritise economic growth alongside public services.
  economy: Scottish economic sovereignty is the core argument. Independence would allow Scotland to tailor economic policy to Scottish needs.
  education: Protect standards. Maintain free university tuition. Critical of some progressive curriculum reforms introduced under the SNP.
  equality: Socially conservative on gender issues. The split from the SNP in 2021 was partly driven by disagreement over the Gender Recognition Reform Bill. Oppose self-identification.
