projectionSource: "More in Common 2026 Holyrood MRP (April 2026) projects a three-way knife-edge with Greens 26 / Labour 25 / SNP 24 — all within two points — and names the seat as one of two constituency Green wins alongside Glasgow Kelvin and Maryhill. YouGov's first 2026 Holyrood MRP (fieldwork 23 March to 8 April 2026) gives the Greens only Edinburgh Central and otherwise has the SNP holding Edinburgh seats; Electoral Calculus's April 2026 Scotland MRP shows SNP winning 7 of 8 constituencies in the Edinburgh and Lothians East region. The Ballot Box Scotland 2021 notional places this seat as a notional SNP hold for Ben Macpherson. Aggregating these, the seat is best described as a Green/Labour/SNP toss-up."
