projectionSource: "Three April 2026 MRPs converge on an SNP gain. YouGov MRP (fieldwork 23 March to 8 April 2026) puts SNP 35 and incumbent Jackson Carlaw (Conservative) 24 in Eastwood. Electoral Calculus Scotland MRP (7 April 2026) explicitly lists Eastwood among Conservative-to-SNP gains. More in Common Holyrood MRP (24 March to 10 April 2026) likewise places Eastwood in the SNP column. Ballot Box Scotland's SP26 battlegrounds and Conservative profile flag Eastwood as a key Tory loss, noting Carlaw's notional 2021 majority of just 5.2 percent and Labour's strong 2024 UK swing in East Renfrewshire. The Conservative share is left well above national 8-12 percent because Carlaw's incumbency and Eastwood's affluent demographic insulate the seat from the broader Tory collapse, but the 11-point MRP gap looks too wide for a personal-vote-led hold."
