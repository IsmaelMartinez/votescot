bio: Labour constituency candidate. New boundaries pull in areas from Edinburgh
  Southern (Labour territory), giving a realistic path to winning. Sarwar called
  for PM Starmer to resign (Feb 2026) — unusual Scottish-UK Labour tension.
highlights:
  - New boundaries favour Labour in this seat
  - No Holyrood voting record — first-time candidate
  - Sarwar's split with Starmer creates UK-Scottish Labour tension
  - Edinburgh Central was Labour (Sarah Boyack) 1999-2011
