bio: MSP since 2016 for Caithness, Sutherland and Ross. Has held continuous ministerial roles since 2017 including Children and Young People, Public Health, and Social Care. Former mental health pharmacist.
highlights:
  - Continuous ministerial service since 2017 across children, health, and sport portfolios
  - MSP since 2016; qualified pharmacist with 20 years in mental health
  - Minister for Public Health, Women's Health and Sport (2021-2023)
