bio: Former nurse and midwife now working as a health and wellness coach, living in Aberdeenshire. Reform UK candidate for Aberdeenshire West with a particular focus on farming and fishing concerns.
highlights:
  - Former nurse and midwife, now a health and wellness coach in Aberdeenshire
  - Campaigns on farming and fishing issues including net zero rules, red diesel and fertiliser costs
  - Reform UK candidate for Aberdeenshire West in the 2026 Scottish Parliament election (previously stood in Aberdeenshire North and Moray East at the 2024 UK general election)
