bio: Former commercial lawyer and Scotland's longest-serving MEP (2004-2019) before becoming MP for Stirling (2019-2024), when he ousted incumbent Tory Stephen Kerr. A former SNP depute leader candidate, he has been selected to stand for Stirling at Holyrood as Evelyn Tweed steps down.
highlights:
  - MP for Stirling (2019-2024); Scotland's MEP for 15 years (2004-2019)
  - Youngest Scottish MEP when first elected aged 30
  - Former commercial lawyer at Clifford Chance
  - SNP candidate for Stirling constituency in the 2026 Scottish Parliament election
