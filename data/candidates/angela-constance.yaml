bio: Cabinet Secretary for Justice and Home Affairs since 2023 and MSP for
  Almond Valley since 2007. A former social worker by profession, Constance has
  held multiple cabinet roles including Education, Communities, and Social
  Security. She also serves as the SNP's Business Convener (party chair) since
  2023, overseeing party management and election campaigns.
highlights:
  - Cabinet Secretary for Justice and Home Affairs since 2023
  - SNP Business Convener (party chair) since November 2023
  - Former Cabinet Secretary for Education and Lifelong Learning (2014-2016)
  - Former Minister for Drugs Policy (2020-2023)
  - Former social worker; MSP since 2007
