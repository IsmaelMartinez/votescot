bio: Labour MSP for Mid Scotland and Fife since 2007. Convener of the Economy and Fair Work Committee. Has held multiple shadow cabinet roles including Education and Rural Affairs.
highlights:
  - MSP for Mid Scotland and Fife since 2007; one of Labour's longer-serving MSPs
  - Convener of the Economy and Fair Work Committee
  - Shadow Minister for Drugs Policy; holds a PhD from the University of Glasgow
