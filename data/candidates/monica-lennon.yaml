bio: Labour MSP for Central Scotland since 2016. Legislated the Period Products Act 2021, making Scotland the first country to guarantee free access to period products. Contested the 2021 Scottish Labour leadership.
highlights:
  - Legislated the Period Products Act 2021 — Scotland first in the world to guarantee free period products
  - Contested the 2021 Scottish Labour leadership election against Anas Sarwar
  - MSP for Central Scotland since 2016; former town planner
