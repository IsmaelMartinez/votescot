bio: Leader of the Scottish Liberal Democrats since 2021. MSP for Edinburgh Western since 2016 — won with the highest vote ever for a single candidate in a Scottish Parliament election. Standing in the redrawn Edinburgh North Western. Campaigns on mental health, children's services, and NHS recovery.
highlights:
  - Leader of the Scottish Liberal Democrats
  - Won Edinburgh Western 2016 and 2021 with record-breaking vote counts
  - Campaigned on children's mental health and NHS workforce
  - Ruled out serving in any SNP-led administration
  - Frontrunner in Edinburgh North Western
