bio: Cabinet Secretary for Social Justice since 2023 and MSP for Dunfermline since 2016. A long-standing SNP member who joined the party at 16, Somerville previously served as Cabinet Secretary for Education and Skills (2021-2023) and Cabinet Secretary for Social Security and Older People (2018-2021). She worked in housing policy and public affairs before entering Parliament.
highlights:
  - Cabinet Secretary for Social Justice since 2023
  - Former Cabinet Secretary for Education and Skills (2021-2023)
  - Cabinet Secretary for Social Security and Older People (2018-2021)
  - Previously worked at the Chartered Institute of Housing and Royal College of Nursing
  - MSP since 2007 (Lothians region 2007-2011, Dunfermline from 2016)
