bio: MSP for Coatbridge and Chryston since 2016, the first SNP MSP ever elected for the constituency. Re-elected in 2021 with 57% vote share. Former social worker.
highlights:
  - First SNP MSP elected for Coatbridge and Chryston (2016); re-elected with 57% in 2021
  - Serves on the Justice Committee and Education and Skills Committee
  - Former qualified social worker; North Lanarkshire councillor from 2012
