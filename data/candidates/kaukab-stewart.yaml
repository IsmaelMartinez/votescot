bio: MSP for Glasgow Kelvin since 2021. Minister for Equalities since May 2024.
  One of the first women of colour elected to the Scottish Parliament. Former
  primary teacher for nearly 30 years.
highlights:
  - Minister for Equalities since May 2024; one of the first women of colour in
    the Scottish Parliament
  - MSP for Glasgow Kelvin since 2021; former primary teacher for nearly 30 years
