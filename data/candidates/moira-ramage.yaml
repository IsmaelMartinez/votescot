bio: Edinburgh law graduate and qualified Scottish solicitor with a career at the Crown Office and Procurator Fiscal Service (including as a District Procurator Fiscal) and on Scottish Government legislation for victims and witnesses. Lived in the Bishopton and Erskine area for over 30 years and is active on her local community council.
highlights:
  - Former District Procurator Fiscal who worked on Scottish Government victims and witnesses legislation
  - Member of Parole Board for Scotland; over 30 years in the Bishopton and Erskine area
  - Reform UK candidate for Renfrewshire North and Cardonald in the 2026 Scottish Parliament election
