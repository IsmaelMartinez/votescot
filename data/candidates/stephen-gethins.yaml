bio: Currently MP for Arbroath and Broughty Ferry. Previously MP for North East Fife (2015-2019), re-elected in 2017 by just two votes. SNP foreign affairs spokesperson and former special adviser to First Ministers Salmond and Sturgeon.
highlights:
  - MP re-elected in 2017 by just two votes — the slimmest margin in UK history that election
  - SNP foreign affairs spokesperson at Westminster
  - Former special adviser on European affairs to First Ministers Salmond and Sturgeon
  - Lecturer in international relations at the University of St Andrews
