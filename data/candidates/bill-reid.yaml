bio: Brought up on a farm in Angus and trained at agricultural college before
  joining the Army, where he served as a surveyor and retired as a Regimental
  Sergeant Major. After leaving the military he retrained and worked in
  London's finance sector, then ran his own business in Manchester before
  returning to Scotland.
