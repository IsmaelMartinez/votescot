bio: MSP for Edinburgh Northern and Leith since 2016 and currently serving as Minister for Higher and Further Education. A former commercial lawyer, Macpherson has held a series of ministerial roles covering migration, public finance, rural affairs, and social security. He joined the SNP in 2005 after leaving Labour over the Iraq War.
highlights:
  - Minister for Higher and Further Education
  - MSP for Edinburgh Northern and Leith since 2016
  - Former Minister for Europe, Migration and International Development (2018-2020)
  - Former Minister for Social Security and Local Government (2021-2023)
  - Former commercial lawyer; also worked in renewable energy
