bio: Former Scottish Green co-leader (2019-2025) and MSP for Lothian since 2021. Minister for Green Skills, Circular Economy and Biodiversity (2021-2024) under the Bute House Agreement. Former tidal energy engineer.
highlights:
  - Scottish Green co-leader (2019-2025); one of the first Green ministers in UK government history
  - Minister for Green Skills, Circular Economy and Biodiversity (2021-2024)
  - Delivered bans on problematic single-use plastics; former tidal energy engineer
