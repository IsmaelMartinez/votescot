bio: Labour MSP for South Scotland since May 2021. A registered dietician for
  17 years in the NHS before entering politics, she grew up in Ayrshire and
  attended Auchinleck Academy. She serves as Scottish Labour's Shadow Minister
  for Mental Wellbeing, Women's Health and Sport.
highlights:
  - Labour MSP for South Scotland since 2021
  - Shadow Minister for Mental Wellbeing, Women's Health and Sport
  - Scottish Labour spokesperson on Public Health and Women's Health
  - Worked as an NHS dietician for 17 years before entering politics
