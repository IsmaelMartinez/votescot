stances:
  independence: Oppose independence. Focus on strengthening devolution within the UK. Want Scotland to lead reform of the union, not leave it.
  nhs: Declare a waiting times emergency. Pledge 160,000 extra NHS appointments. Increase capacity for mental health and cancer services.
  housing: Build new social and affordable housing. Support first-time buyers with targeted schemes. Reform planning to unlock more homes.
  climate: Support UK net zero targets and back GB Energy, Labour's publicly owned clean energy company. Promote Scottish renewables jobs.
  tax: Maintain current Scottish income tax rates. No planned increases or cuts. Focus on economic growth to fund services.
  economy: Back GB Energy as a driver of Scottish investment. Reform planning laws to attract business. Support industrial transition in heavy industry areas.
  education: Close the attainment gap between richest and poorest pupils. Ban mobile phones in classrooms. Invest in teaching workforce.
  equality: Progressive on equalities generally. More cautious position on gender recognition reform — supportive of trans rights while emphasising women's spaces.
