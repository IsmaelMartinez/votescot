bio: MSP for Glasgow Maryhill and Springburn since 2016, having previously served as a regional MSP for Glasgow from 2007. A former Modern Studies teacher of ten years, Doris was educated at the University of Glasgow and St Andrew's Teaching College. Deputy convener of the Social Justice and Social Security Committee.
