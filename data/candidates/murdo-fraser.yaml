bio: One of the longest-serving Conservative MSPs, Fraser has represented the Mid Scotland and Fife region since 2001. A solicitor by background, he served as Deputy Leader of the Scottish Conservatives (2005-2011) and was a candidate in the 2011 and 2024 party leadership elections. He currently serves as Shadow Cabinet Secretary for Business, Economic Growth and Tourism.
highlights:
  - MSP for Mid Scotland and Fife since 2001
  - Former Deputy Leader of the Scottish Conservatives (2005-2011)
  - Shadow Cabinet Secretary for Business, Economic Growth and Tourism
  - Candidate in the 2011 and 2024 Scottish Conservative leadership elections
  - Solicitor specialising in commercial property before entering Parliament
