bio: Long-standing Labour candidate in East Dunbartonshire, having stood for the Westminster seat at the 2017 and 2019 UK general elections and for Strathkelvin and Bearsden at the 2021 Scottish Parliament election. He was also a candidate in Lenzie and Kirkintilloch South at the 2022 East Dunbartonshire council election.
highlights:
  - Labour candidate, East Dunbartonshire, 2017 and 2019 UK general elections
  - Labour candidate, Strathkelvin and Bearsden, 2021 Holyrood (8,510 votes, third place)
  - Labour and Co-operative candidate, Lenzie and Kirkintilloch South, 2022 East Dunbartonshire council election
