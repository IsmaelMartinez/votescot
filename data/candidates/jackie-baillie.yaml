bio: Deputy Leader of the Scottish Labour Party since 2020 and MSP for Dumbarton
  since 1999, making her the only Scottish Labour MSP to have held their
  constituency seat continuously since the Parliament's creation. Before
  entering politics she worked in local government in community economic
  development. She has twice served as acting leader of Scottish Labour.
highlights:
  - Deputy Leader of the Scottish Labour Party since 2020
  - Only Labour MSP to have won the same constituency in every election since
    1999
  - Served as acting Leader of Scottish Labour in 2017 and 2021
  - Former Minister for Social Justice in the Scottish Executive (2000-2001)
  - Shadow Cabinet Secretary for NHS Recovery, Health and Social Care
