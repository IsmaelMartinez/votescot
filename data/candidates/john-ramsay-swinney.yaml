bio: First Minister of Scotland since May 2024 and leader of the SNP. A veteran of Scottish politics, Swinney has been an MSP since 1999 and previously served as SNP leader (2000-2004), Deputy First Minister (2014-2023), and Cabinet Secretary for Finance. He is one of the longest-serving members of the Scottish Parliament.
highlights:
  - First Minister of Scotland since May 2024
  - Previously served as Deputy First Minister (2014-2023)
  - SNP leader twice — 2000-2004 and again from 2024
  - Cabinet Secretary for Finance (2007-2016) and Education (2016-2023)
  - MSP continuously since the Scottish Parliament's creation in 1999
