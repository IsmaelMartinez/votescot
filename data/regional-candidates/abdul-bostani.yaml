bio: Abdul Bostani is a long-standing SNP activist in Glasgow who won the Partick East/Kelvindale by-election in 2021 and has since stood again for the SNP, including in Maryhill at the 2022 Glasgow City Council elections. He is the SNP's tenth-placed candidate on the Glasgow regional list for 2026.
