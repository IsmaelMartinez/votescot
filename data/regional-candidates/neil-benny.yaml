bio: Scottish Conservative regional list candidate for Central Scotland and Lothians West and constituency candidate for Falkirk West. Neil Benny stood for the Conservatives in Stirling and Strathallan at the 2024 UK general election and contested Falkirk East at the 2021 Scottish Parliament election, alongside two Stirling council bids.
highlights:
  - Stood for the Scottish Conservatives in Stirling and Strathallan at the 2024 UK general election
  - Contested Falkirk East at the 2021 Scottish Parliament election (3rd place)
  - Stood in Stirling West at the 2017 and 2022 council elections
