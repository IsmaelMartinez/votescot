bio: Liberal Democrat regional list candidate for Edinburgh and Lothians East and constituency candidate for Edinburgh North Eastern and Leith. Liss Owen is a former teacher and the chief executive of a charity supporting young people experiencing homelessness, who entered politics after Liberal Democrat councillors helped her as a victim of crime.
highlights:
  - Chief executive of a charity supporting homeless young people; former teacher
  - Previously stood as a Liberal Democrat candidate in Spennymoor at the 2025 local elections
  - Standing for both the Edinburgh North Eastern and Leith constituency and the regional list
