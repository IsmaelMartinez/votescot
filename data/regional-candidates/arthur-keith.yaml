bio: Arthur Keith was born in Dundee and joined the Army at 15, eventually serving as a Regimental Sergeant Major with 1st Battalion The Black Watch. After leaving the forces he worked as a security professional in conflict zones from 2005 to 2015 and now runs a small facilities management business. He stood for All for Unity on the North East Scotland list in 2021.
