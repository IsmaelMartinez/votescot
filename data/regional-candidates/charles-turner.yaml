bio: Charles Turner is the son of Windrush Generation parents who came to the UK from the West Indies in the 1960s. He completed an apprenticeship in lift engineering in the 1990s, became a service manager and later a lift consultant for an international real estate firm, and now runs his own lift consultancy. He is also Reform UK's candidate for Edinburgh Southern.
