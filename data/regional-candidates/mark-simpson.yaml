bio: Reform UK regional list candidate for North East Scotland and constituency candidate for Dundee City East. Mark Simpson has previously stood as a Reform UK candidate in London, including for Eltham and Chislehurst at the 2024 UK general election and the London Assembly elections in 2021 and 2024.
