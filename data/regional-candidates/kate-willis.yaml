bio: Marine ecologist and wildlife tour guide who has lived in the Highlands for nearly twenty years. She works for Lochaber Environmental Group on active travel and cycling infrastructure projects, including HIBIKE, Fort William's e-bike share scheme. She was the first Scottish Green to stand in council elections in Lochaber.
