bio: Served as MSP for Lothian from 2016 to 2026, sitting as a Scottish Conservative until 2025 before continuing as an Independent. He has been a long-standing voice on social security, welfare, disability rights and equalities through successive deputy spokesperson roles.
highlights:
  - Elected MSP for Lothian in 2016, re-elected 2021
  - Member of the Social Justice and Social Security Committee, 2021-2026
  - Member of the Delegated Powers and Law Reform Committee
  - Conservative deputy spokesperson on social security, social justice and housing
  - Left the Scottish Conservatives to sit as an Independent in 2025
