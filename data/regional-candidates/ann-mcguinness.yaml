bio: Ann McGuinness stood for the Scottish Greens in the 2025 Hamilton, Larkhall and Stonehouse Holyrood by-election (5th of 10, 695 votes) and in East Kilbride and Strathaven at the 2024 UK general election (5th of 8). She also contested Clydesdale South at the 2022 South Lanarkshire Council elections.
