bio: Reform UK regional list candidate for Mid Scotland and Fife and constituency candidate for Cowdenbeath. Mark Davies served 25 years in the British Army with operational deployments worldwide, then worked as a Ministry of Defence civil servant for 15 years, and chairs a community group in Cowdenbeath.
