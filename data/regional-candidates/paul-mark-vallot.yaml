bio: Scottish Green Party regional list candidate (8th place) for Mid Scotland and Fife. Paul Vallot has been a recurring Green candidate in the Perth area, contesting the 2021 Mid Scotland and Fife regional ballot, the 2017 Perth City South and 2022 Almond and Earn council seats, and the 2020 Perth City North by-election.
highlights:
  - Stood for the Scottish Greens at the 2021 Scottish Parliament regional election
  - Contested Almond and Earn ward at the 2022 Perth and Kinross council elections
  - Previously stood in the 2020 Perth City North local by-election
