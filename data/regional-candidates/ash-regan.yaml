bio: Served as MSP for Edinburgh Eastern from 2016 to 2026, sitting first as SNP, then for Alba from 2023, and as an Independent from 2025. She was Minister for Community Safety in the Scottish Government before resigning in 2022 over the Gender Recognition Reform Bill, and is known for hardline pro-independence and gender-critical positions.
highlights:
  - Elected MSP for Edinburgh Eastern in 2016, re-elected 2021
  - Served as Minister for Community Safety in the Scottish Government
  - Resigned from government in 2022 over the Gender Recognition Reform Bill
  - Crossed the floor to Alba in 2023, then sat as Independent from 2025
