bio: Served as Scottish Green MSP for West Scotland from 2016 to 2026, becoming party co-leader in August 2025. He was the Greens' spokesperson on education throughout his tenure, took on the finance brief in 2024, and sat on the Finance and Public Administration Committee for most of the 6th session.
highlights:
  - Elected MSP for West Scotland in 2016, re-elected 2021
  - Scottish Greens co-leader from August 2025 until dissolution
  - Spokesperson on education, 2021-2026, and on finance from 2024
  - Member of the Finance and Public Administration Committee, 2021-2025
