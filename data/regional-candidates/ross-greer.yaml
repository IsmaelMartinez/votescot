stances:
  independence: Support independence and full powers of a sovereign nation, while pressing ahead with change using devolved powers now.
  nhs: Introduce a £15 per hour minimum wage for social care, a network of free walk-in mental health support hubs, and invest in the NHS workforce.
  housing: Permanent rent controls, a higher tax rate on landlords' rental income, and stronger renters' rights to tackle the housing emergency.
  climate: Get Scotland back on track to deliver net zero by 2045 with a coordinated climate action delivery programme across transport, energy, farming and buildings.
  tax: Tax wealth rather than work. More progressive income tax, higher taxes on second and empty homes, and new taxes on private jets and mansions.
  economy: Jobs in a green economy — clean industries, care, childcare and community wealth. Move away from expensive and volatile oil and gas.
  education: Universal free childcare guarantee from 6 months until children start school, with significant investment in the childcare workforce.
  equality: Strong LGBT+ rights advocacy. Revisit NHS policy changes made as a result of the Cass Review and publish a gender-affirming care action plan to bring down waiting times.
