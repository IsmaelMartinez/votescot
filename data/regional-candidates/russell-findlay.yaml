bio: Served as Conservative MSP for West Scotland from 2021 to 2026 and led the Scottish Conservatives from September 2024 until dissolution. A former investigative journalist, he was the party's justice spokesperson from 2023 and Deputy Convener of the Criminal Justice Committee until taking on the leadership.
highlights:
