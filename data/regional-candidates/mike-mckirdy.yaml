bio: Scottish Labour regional list candidate for West Scotland and constituency candidate for Renfrewshire North and Cardonald. Mike McKirdy is a retired consultant surgeon with more than 27 years of experience at the Royal Alexandra Hospital in Paisley, campaigning on the basis of his NHS background.
highlights:
  - Retired consultant surgeon with over 27 years at the Royal Alexandra Hospital in Paisley
  - Standing for both the Renfrewshire North and Cardonald constituency and the regional list
  - Campaigns on NHS reform after Labour's 19 years out of power at Holyrood
