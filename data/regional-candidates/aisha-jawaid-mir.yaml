bio: Aisha Jawaid Mir is a businesswoman with a finance career who graduated from the University of the West of Scotland in 1996 (the first in her family to attend university). A Liberal Democrat since 2013, she is a Children's Panel member and has stood at multiple UK and Scottish Parliament elections, most recently the 2025 Hamilton, Larkhall and Stonehouse by-election (6th of 10) and East Kilbride and Strathaven at the 2024 UK general election (6th of 8).
