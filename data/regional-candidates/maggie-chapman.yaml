bio: Served as Scottish Green MSP for North East Scotland from 2021 to 2026, having previously co-convened the Scottish Greens between 2013 and 2019. She was the party's spokesperson on justice, human rights and (latterly) social justice, and deputy convener of the Equalities, Human Rights and Civil Justice Committee.
highlights:
