bio: Clackmannanshire councillor for Clackmannanshire North, first elected in May 2022, where she serves as the SNP group's spokesperson on Environment and Net Zero. Her professional background is in financial services quality assurance and she helped set up a local breastfeeding peer-support group during the pandemic.
