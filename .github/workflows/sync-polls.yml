name: Sync Polls

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync polling data
        run: npx tsx scripts/sync-polls.ts
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/polls.json
          if git diff --cached --quiet; then
            echo "No new polls"
          else
            git commit -m "polls: update polling data from Wikipedia"
            git push
          fi
